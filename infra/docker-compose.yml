# Local development stack. Only 127.0.0.1 ports are published, so nothing is reachable from
# your network. Production compose (only the gateway exposed, behind HTTPS) comes in step 1.6.
# From the repo root:
#   pnpm infra:up       build and start everything (docker compose -f infra/docker-compose.yml up -d --build)
#   pnpm health         curl every /health
#   pnpm infra:down     stop (add -v to the compose command to also wipe Postgres/RabbitMQ/Redis data)
# Optional overrides: cp infra/.env.example infra/.env
name: zelqune

# One image for all backend apps; only the gateway builds it, so it is built and unpacked once.
x-app: &app
  image: zelqune-backend:local
  pull_policy: never
  restart: unless-stopped
  networks: [backend]
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:'+process.env.HTTP_PORT+'/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
      ]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 30s

x-service-env: &service-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TCP_HOST: 0.0.0.0
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-zelqune}:${RABBITMQ_PASSWORD:-zelqune_dev}@rabbitmq:5672

x-service-deps: &service-deps
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zelqune}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zelqune_dev}
      POSTGRES_DB: ${POSTGRES_DB:-zelqune}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-zelqune_svc_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ['127.0.0.1:5432:5432']
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-zelqune} -d ${POSTGRES_DB:-zelqune}']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-zelqune}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-zelqune_dev}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    # 5672 AMQP, 15672 management UI (http://localhost:15672)
    ports: ['127.0.0.1:5672:5672', '127.0.0.1:15672:15672']
    networks: [backend]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  # Local test inbox for account emails (free, offline): SMTP on 1025, web inbox on 8025.
  mailpit:
    image: axllent/mailpit:v1.27.11
    restart: unless-stopped
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports: ['127.0.0.1:6379:6379']
    networks: [backend]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    <<: *app
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      APP: gateway
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_PORT: 3000
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100,http://localhost:3200}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      AUTH_EMAILS_PER_HOUR: ${AUTH_EMAILS_PER_HOUR:-10}
      CUSTOMER_LOGIN_MAX_PER_IP: ${CUSTOMER_LOGIN_MAX_PER_IP:-30}
      STOREFRONT_URL: ${STOREFRONT_URL:-http://localhost:3100}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      TRUST_PROXY: 'false'
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT keys missing - run pnpm keys:dev}
      COOKIE_SECURE: 'true'
      IDENTITY_SERVICE_HOST: identity-service
      IDENTITY_SERVICE_PORT: 4001
      CATALOG_SERVICE_HOST: catalog-service
      CATALOG_SERVICE_PORT: 4002
      INVENTORY_SERVICE_HOST: inventory-service
      INVENTORY_SERVICE_PORT: 4003
      ORDER_SERVICE_HOST: order-service
      ORDER_SERVICE_PORT: 4004
      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: 4005
      SHIPPING_SERVICE_HOST: shipping-service
      SHIPPING_SERVICE_PORT: 4006
      NOTIFICATION_SERVICE_HOST: notification-service
      NOTIFICATION_SERVICE_PORT: 4007
      ANALYTICS_SERVICE_HOST: analytics-service
      ANALYTICS_SERVICE_PORT: 4008
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy

  identity-service:
    <<: *app
    environment:
      <<: *service-env
      APP: identity-service
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT keys missing - run pnpm keys:dev}
      OWNER_PHONE: ${OWNER_PHONE:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_NAME: ${OWNER_NAME:-}
      HTTP_PORT: 3001
      TCP_PORT: 4001
      DB_SCHEMA: identity
      DATABASE_URL: postgresql://identity_svc:${SERVICE_DB_PASSWORD:-zelqune_svc_dev}@postgres:5432/${POSTGRES_DB:-zelqune}?schema=identity
    ports: ['127.0.0.1:3001:3001']
    depends_on: *service-deps

  catalog-service:
    <<: *app
    environment:
      <<: *service-env
      APP: catalog-service
      STORAGE_DRIVER: local
      MEDIA_PUBLIC_BASE_URL: http://localhost:3002/dev-storage
      LOCAL_STORAGE_DIR: /app/storage
      LOCAL_STORAGE_SIGNING_SECRET: ${LOCAL_STORAGE_SIGNING_SECRET:-}
      HTTP_PORT: 3002
      TCP_PORT: 4002
      DB_SCHEMA: catalog
      DATABASE_URL: postgresql://catalog_svc:${SERVICE_DB_PASSWORD:-zelqune_svc_dev}@postgres:5432/${POSTGRES_DB:-zelqune}?schema=catalog
    ports: ['127.0.0.1:3002:3002']
    volumes:
      - media-data:/app/storage
    depends_on: *service-deps

  inventory-service:
    <<: *app
    environment:
      <<: *service-env
      APP: inventory-service
      ORDER_HOLD_HOURS: ${ORDER_HOLD_HOURS:-48}
      HTTP_PORT: 3003
      TCP_PORT: 4003
      DB_SCHEMA: inventory
      DATABASE_URL: postgresql://inventory_svc:${SERVICE_DB_PASSWORD:-zelqune_svc_dev}@postgres:5432/${POSTGRES_DB:-zelqune}?schema=inventory
    ports: ['127.0.0.1:3003:3003']
    depends_on: *service-deps

  order-service:
    <<: *app
    environment:
      <<: *service-env
      APP: order-service
      CUSTOMER_KEY_SECRET: ${CUSTOMER_KEY_SECRET:?run pnpm keys:dev}
      # saga participants (ADR 0008)
      CATALOG_SERVICE_HOST: catalog-service
      CATALOG_SERVICE_PORT: 4002
      INVENTORY_SERVICE_HOST: inventory-service
      INVENTORY_SERVICE_PORT: 4003
      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: 4005
      SHIPPING_SERVICE_HOST: shipping-service
      SHIPPING_SERVICE_PORT: 4006
      ADVANCE_MODE: fixed
      ADVANCE_FIXED_PAISA: ${ADVANCE_FIXED_PAISA:-30000}
      ORDER_HOLD_HOURS: ${ORDER_HOLD_HOURS:-48}
      HTTP_PORT: 3004
      TCP_PORT: 4004
      DB_SCHEMA: orders
      DATABASE_URL: postgresql://orders_svc:${SERVICE_DB_PASSWORD:-zelqune_svc_dev}@postgres:5432/${POSTGRES_DB:-zelqune}?schema=orders
    ports: ['127.0.0.1:3004:3004']
    depends_on: *service-deps

  payment-service:
    <<: *app
    environment:
      <<: *service-env
      APP: payment-service
      PAYMENT_BKASH_NUMBER: ${PAYMENT_BKASH_NUMBER:-}
      PAYMENT_BKASH_ACCOUNT_TYPE: ${PAYMENT_BKASH_ACCOUNT_TYPE:-personal}
      PAYMENT_NAGAD_NUMBER: ${PAYMENT_NAGAD_NUMBER:-}
      PAYMENT_NAGAD_ACCOUNT_TYPE: ${PAYMENT_NAGAD_ACCOUNT_TYPE:-personal}
      HTTP_PORT: 3005
      TCP_PORT: 4005
      DB_SCHEMA: payments
      DATABASE_URL: postgresql://payments_svc:${SERVICE_DB_PASSWORD:-zelqune_svc_dev}@postgres:5432/${POSTGRES_DB:-zelqune}?schema=payments
    ports: ['127.0.0.1:3005:3005']
    depends_on: *service-deps

  shipping-service:
    <<: *app
    environment:
      <<: *service-env
      APP: shipping-service
      HTTP_PORT: 3006
      TCP_PORT: 4006
      DB_SCHEMA: shipping
      DATABASE_URL: postgresql://shipping_svc:${SERVICE_DB_PASSWORD:-zelqune_svc_dev}@postgres:5432/${POSTGRES_DB:-zelqune}?schema=shipping
    ports: ['127.0.0.1:3006:3006']
    depends_on: *service-deps

  notification-service:
    <<: *app
    environment:
      <<: *service-env
      APP: notification-service
      OWNER_NOTIFY_PHONE: ${OWNER_NOTIFY_PHONE:-}
      STOREFRONT_URL: ${STOREFRONT_URL:-http://localhost:3100}
      # Dev: every email lands in Mailpit (http://localhost:8025); nothing leaves this machine.
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Zelqune <hello@zelqune.com>}
      HTTP_PORT: 3007
      TCP_PORT: 4007
      DB_SCHEMA: notifications
      DATABASE_URL: postgresql://notifications_svc:${SERVICE_DB_PASSWORD:-zelqune_svc_dev}@postgres:5432/${POSTGRES_DB:-zelqune}?schema=notifications
    ports: ['127.0.0.1:3007:3007']
    depends_on: *service-deps

  analytics-service:
    <<: *app
    environment:
      <<: *service-env
      APP: analytics-service
      HTTP_PORT: 3008
      TCP_PORT: 4008
      DB_SCHEMA: analytics
      DATABASE_URL: postgresql://analytics_svc:${SERVICE_DB_PASSWORD:-zelqune_svc_dev}@postgres:5432/${POSTGRES_DB:-zelqune}?schema=analytics
    ports: ['127.0.0.1:3008:3008']
    depends_on: *service-deps

networks:
  backend:

volumes:
  media-data:
  postgres-data:
  rabbitmq-data:
  redis-data:
