# Production stack for one VPS (docs/deploy.md). Only Caddy is reachable from outside, on 80/443;
# everything else talks on private Docker networks. Every secret must be set in infra/.env.production
# (template: infra/.env.production.example) — there are no dev defaults here.
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production up -d --build
name: zelqune-prod

x-logging: &logging # Rotate container logs so they can't fill the disk (5 x 20 MB per container).
  driver: json-file
  options: { max-size: 20m, max-file: '5' }

x-app: &app
  image: zelqune-backend:${RELEASE:-latest}
  pull_policy: never
  restart: unless-stopped
  logging: *logging
  networks: [backend]
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:'+process.env.HTTP_PORT+'/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
      ]
    interval: 15s
    timeout: 5s
    retries: 6
    start_period: 40s

x-service-env: &service-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TCP_HOST: 0.0.0.0
  RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672
  INTERNAL_RPC_SECRET: ${INTERNAL_RPC_SECRET:?}

x-service-deps: &service-deps
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *logging
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      DOMAIN: ${DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on: [frontend, dashboard, gateway, catalog-service]

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP: frontend
        PORT: 3100
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        MEDIA_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?}
    image: zelqune-frontend:${RELEASE:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      # Server-side rendering calls the gateway on the private network.
      API_URL: http://gateway:3000
      PRICE_EXPERIMENT: ${PRICE_EXPERIMENT:-}
    volumes:
      - image-cache:/app/frontend/.next/cache/images
    networks: [edge]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/en').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      gateway:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP: dashboard
        PORT: 3200
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    image: zelqune-dashboard:${RELEASE:-latest}
    restart: unless-stopped
    logging: *logging
    networks: [edge]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [backend]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?}']
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  gateway:
    <<: *app
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    networks: [backend, edge]
    environment:
      APP: gateway
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_PORT: 3000
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      CORS_ORIGINS: https://${DOMAIN},https://www.${DOMAIN},https://admin.${DOMAIN}
      PUBLIC_API_URL: https://api.${DOMAIN}
      STOREFRONT_URL: https://${DOMAIN}
      API_DOCS: 'false'
      # One hop: Caddy. Client IPs drive rate limits and session metadata.
      TRUST_PROXY: '1'
      COOKIE_SECURE: 'true'
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?}
      INTERNAL_RPC_SECRET: ${INTERNAL_RPC_SECRET:?}
      IDENTITY_SERVICE_HOST: identity-service
      IDENTITY_SERVICE_PORT: 4001
      CATALOG_SERVICE_HOST: catalog-service
      CATALOG_SERVICE_PORT: 4002
      INVENTORY_SERVICE_HOST: inventory-service
      INVENTORY_SERVICE_PORT: 4003
      ORDER_SERVICE_HOST: order-service
      ORDER_SERVICE_PORT: 4004
      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: 4005
      SHIPPING_SERVICE_HOST: shipping-service
      SHIPPING_SERVICE_PORT: 4006
      NOTIFICATION_SERVICE_HOST: notification-service
      NOTIFICATION_SERVICE_PORT: 4007
      ANALYTICS_SERVICE_HOST: analytics-service
      ANALYTICS_SERVICE_PORT: 4008
    depends_on:
      redis: { condition: service_healthy }
      identity-service: { condition: service_healthy }
      catalog-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      shipping-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      analytics-service: { condition: service_healthy }

  identity-service:
    <<: *app
    environment:
      <<: *service-env
      APP: identity-service
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?}
      OWNER_PHONE: ${OWNER_PHONE:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_NAME: ${OWNER_NAME:-}
      HTTP_PORT: 3001
      TCP_PORT: 4001
      DB_SCHEMA: identity
      DATABASE_URL: postgresql://identity_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=identity
    depends_on: *service-deps

  catalog-service:
    <<: *app
    # On the edge network too: Caddy serves product photos from it when STORAGE_DRIVER=local.
    networks: [backend, edge]
    environment:
      <<: *service-env
      APP: catalog-service
      STORAGE_DRIVER: ${STORAGE_DRIVER:?}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?}
      LOCAL_STORAGE_DIR: /app/storage
      LOCAL_STORAGE_SIGNING_SECRET: ${LOCAL_STORAGE_SIGNING_SECRET:?}
      DEV_STORAGE_CORS_ORIGINS: https://admin.${DOMAIN},https://${DOMAIN}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      HTTP_PORT: 3002
      TCP_PORT: 4002
      DB_SCHEMA: catalog
      DATABASE_URL: postgresql://catalog_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=catalog
    volumes:
      - media-data:/app/storage
    depends_on: *service-deps

  inventory-service:
    <<: *app
    environment:
      <<: *service-env
      APP: inventory-service
      ORDER_HOLD_HOURS: ${ORDER_HOLD_HOURS:-48}
      HTTP_PORT: 3003
      TCP_PORT: 4003
      DB_SCHEMA: inventory
      DATABASE_URL: postgresql://inventory_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=inventory
    depends_on: *service-deps

  order-service:
    <<: *app
    environment:
      <<: *service-env
      APP: order-service
      CUSTOMER_KEY_SECRET: ${CUSTOMER_KEY_SECRET:?}
      CATALOG_SERVICE_HOST: catalog-service
      CATALOG_SERVICE_PORT: 4002
      INVENTORY_SERVICE_HOST: inventory-service
      INVENTORY_SERVICE_PORT: 4003
      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: 4005
      SHIPPING_SERVICE_HOST: shipping-service
      SHIPPING_SERVICE_PORT: 4006
      ADVANCE_MODE: fixed
      ADVANCE_FIXED_PAISA: ${ADVANCE_FIXED_PAISA:-30000}
      ORDER_HOLD_HOURS: ${ORDER_HOLD_HOURS:-48}
      HTTP_PORT: 3004
      TCP_PORT: 4004
      DB_SCHEMA: orders
      DATABASE_URL: postgresql://orders_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=orders
    depends_on: *service-deps

  payment-service:
    <<: *app
    environment:
      <<: *service-env
      APP: payment-service
      PAYMENT_BKASH_NUMBER: ${PAYMENT_BKASH_NUMBER:-}
      PAYMENT_BKASH_ACCOUNT_TYPE: ${PAYMENT_BKASH_ACCOUNT_TYPE:-personal}
      PAYMENT_NAGAD_NUMBER: ${PAYMENT_NAGAD_NUMBER:-}
      PAYMENT_NAGAD_ACCOUNT_TYPE: ${PAYMENT_NAGAD_ACCOUNT_TYPE:-personal}
      HTTP_PORT: 3005
      TCP_PORT: 4005
      DB_SCHEMA: payments
      DATABASE_URL: postgresql://payments_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=payments
    depends_on: *service-deps

  shipping-service:
    <<: *app
    environment:
      <<: *service-env
      APP: shipping-service
      HTTP_PORT: 3006
      TCP_PORT: 4006
      DB_SCHEMA: shipping
      DATABASE_URL: postgresql://shipping_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=shipping
    depends_on: *service-deps

  notification-service:
    <<: *app
    environment:
      <<: *service-env
      APP: notification-service
      OWNER_NOTIFY_PHONE: ${OWNER_NOTIFY_PHONE:-}
      OWNER_NOTIFY_EMAIL: ${OWNER_NOTIFY_EMAIL:-}
      STOREFRONT_URL: https://${DOMAIN}
      EMAIL_DRIVER: ${EMAIL_DRIVER:?}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Zelqune <support@zelqune.com>}
      HTTP_PORT: 3007
      TCP_PORT: 4007
      DB_SCHEMA: notifications
      DATABASE_URL: postgresql://notifications_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=notifications
    depends_on: *service-deps

  analytics-service:
    <<: *app
    environment:
      <<: *service-env
      APP: analytics-service
      HTTP_PORT: 3008
      TCP_PORT: 4008
      DB_SCHEMA: analytics
      DATABASE_URL: postgresql://analytics_svc:${SERVICE_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=analytics
    depends_on: *service-deps

networks:
  # No ports are published except Caddy's, so neither network is reachable from outside.
  backend:
  edge:

volumes:
  caddy-data:
  caddy-config:
  image-cache:
  media-data:
  postgres-data:
  rabbitmq-data:
  redis-data:
