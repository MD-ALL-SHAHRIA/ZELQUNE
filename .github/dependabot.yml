version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    labels: [type:chore]
    # Majors are upgraded deliberately in a dedicated PR (ADR 0004), never by Dependabot.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    # Minor/patch updates, grouped weekly.
    groups:
      nestjs:
        patterns: ['@nestjs/*', 'nestjs-pino']
        update-types: [minor, patch]
      prisma:
        patterns: ['prisma', '@prisma/*']
        update-types: [minor, patch]
      lint-and-test:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript-eslint',
            'prettier',
            'jest',
            'ts-jest',
            '@types/*',
            'supertest',
          ]
        update-types: [minor, patch]
      other:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    labels: [type:chore, area:infra]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns: ['*']
