name: security

# Fails when a dependency has a known high or critical advisory. Runs on lockfile changes and
# weekly, so a new advisory for code that hasn't changed still shows up (Dependabot opens the fix).
on:
  push:
    branches: [main]
    paths: ['pnpm-lock.yaml', '.github/workflows/security.yml']
  pull_request:
    paths: ['pnpm-lock.yaml', '.github/workflows/security.yml']
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Shipped code only: build tools (e.g. @nestjs/cli) never run on the server.
      - run: pnpm audit --prod --audit-level high
