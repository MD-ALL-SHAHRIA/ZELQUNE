name: backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/backend.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PRs always trigger this workflow so the required check always reports; the main job
  # is skipped (which counts as passing) when nothing relevant changed.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'backend/**'
              - 'infra/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/backend.yml'

  backend:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real infrastructure for the end-to-end suite (backend/test/integration).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zelqune
          POSTGRES_PASSWORD: zelqune_dev
          POSTGRES_DB: zelqune
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zelqune" --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: zelqune
          RABBITMQ_DEFAULT_PASS: zelqune_dev
        ports: ['5672:5672', '15672:15672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 10s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm turbo run lint --filter=@zelqune/backend
      - name: Typecheck
        run: pnpm turbo run typecheck --filter=@zelqune/backend
      - name: Test
        run: pnpm turbo run test --filter=@zelqune/backend
      - name: End-to-end tests (gateway + services on real Postgres/RabbitMQ/Redis)
        run: pnpm --filter @zelqune/backend test:integration
      - name: Build
        run: pnpm turbo run build --filter=@zelqune/backend
      - name: OpenAPI types are up to date
        run: |
          pnpm gen:api
          git diff --exit-code -- packages/api-client || (echo '::error::Run pnpm gen:api and commit the result' && exit 1)
