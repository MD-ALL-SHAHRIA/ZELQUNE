name: backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/backend.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PRs always trigger this workflow so the required check always reports; the main job
  # is skipped (which counts as passing) when nothing relevant changed.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'backend/**'
              - 'infra/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/backend.yml'

  backend:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm turbo run lint --filter=@zelqune/backend
      - name: Typecheck
        run: pnpm turbo run typecheck --filter=@zelqune/backend
      - name: Test
        run: pnpm turbo run test --filter=@zelqune/backend
      - name: Build
        run: pnpm turbo run build --filter=@zelqune/backend
      - name: OpenAPI types are up to date
        run: |
          pnpm gen:api
          git diff --exit-code -- packages/api-client || (echo '::error::Run pnpm gen:api and commit the result' && exit 1)
