name: Feature request
description: Propose a new capability or an improvement
title: 'feat: '
labels: ['type:feature']
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [backend, frontend, dashboard, infra, repo]
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: M1, M2, M3 or M4 from docs/website-build-plan.md
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and why?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: '- [ ] ...'
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
