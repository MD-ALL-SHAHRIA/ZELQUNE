name: Bug report
description: Something is broken or behaves unexpectedly
title: 'bug: '
labels: ['type:bug']
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [backend, frontend, dashboard, infra, repo]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the x-request-id from the response or logs if you have it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Browser/device, local or deployed, commit or branch.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [low, medium, high]
